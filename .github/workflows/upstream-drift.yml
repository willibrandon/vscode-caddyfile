name: Upstream drift

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out extension source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out current Caddy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: caddyserver/caddy
          path: .caddy-current
          fetch-depth: 0
          persist-credentials: false
      - name: Check out current Caddy website source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: caddyserver/website
          path: .website-upstream
          fetch-depth: 0
          persist-credentials: false
      - name: Check out current tree-sitter source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: caddyserver/tree-sitter-caddyfile
          path: .tree-sitter-upstream
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch reviewed tree-sitter pull request
        working-directory: .tree-sitter-upstream
        run: git fetch --no-tags origin pull/64/head
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Verify source identities and documentation links
        run: npm run check:upstream
        env:
          CADDY_CURRENT_SOURCE: ${{ github.workspace }}/.caddy-current
          CADDY_STABLE_SOURCE: ${{ github.workspace }}/.caddy-current
          CADDY_WEBSITE_SOURCE: ${{ github.workspace }}/.website-upstream
          TREE_SITTER_CADDYFILE_SOURCE: ${{ github.workspace }}/.tree-sitter-upstream
      - name: Regenerate against current upstream heads
        shell: bash
        run: |
          export CADDY_SOURCE="$GITHUB_WORKSPACE/.caddy-current"
          export CADDY_REF
          CADDY_REF=$(git -C "$CADDY_SOURCE" rev-parse HEAD)
          export TREE_SITTER_CADDYFILE_SOURCE="$GITHUB_WORKSPACE/.tree-sitter-upstream"
          export TREE_SITTER_CADDYFILE_REF
          TREE_SITTER_CADDYFILE_REF=$(git -C "$TREE_SITTER_CADDYFILE_SOURCE" rev-parse HEAD)
          npm run fixtures:caddy:formatter
          npm run fixtures:caddy:corpus
          npm run fixtures:caddy:registry -- --allow-count-drift
          npm run fixtures:tree-sitter:corpus
      - name: Record reviewable drift
        id: drift
        shell: bash
        run: |
          if git diff --quiet -- test/fixtures/upstream; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff -- test/fixtures/upstream > upstream-drift.patch
          git diff --stat -- test/fixtures/upstream > upstream-drift.txt
      - name: Upload drift
        if: steps.drift.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-drift-${{ github.run_id }}
          path: |
            upstream-drift.patch
            upstream-drift.txt
          if-no-files-found: error
          retention-days: 30
      - name: Create or update drift issue
        if: steps.drift.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="[automated] Upstream Caddyfile data changed"
          issue=$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title == "[automated] Upstream Caddyfile data changed")][0].number // empty')
          body=$(mktemp)
          {
            echo "Current Caddy or tree-sitter sources changed the reviewed fixtures."
            echo
            cat upstream-drift.txt
            echo
            echo "Run: $RUN_URL"
            echo "Download the patch from the run and review it before updating any pin."
          } > "$body"
          if [[ -n "$issue" ]]; then
            gh issue edit "$issue" --body-file "$body" --add-assignee willibrandon --add-label dependencies
          else
            gh issue create --title "$title" --body-file "$body" \
              --assignee willibrandon --label dependencies
          fi
      - name: Close resolved drift issue
        if: steps.drift.outputs.changed == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title == "[automated] Upstream Caddyfile data changed")][0].number // empty')
          if [[ -n "$issue" ]]; then
            gh issue close "$issue" --comment "No fixture drift remains as of $RUN_URL."
          fi
      - name: Summarize reported drift
        if: steps.drift.outputs.changed == 'true'
        run:
          echo "::warning title=Upstream Caddyfile data changed::Review the actionable drift issue
          and attached patch."
